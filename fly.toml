# Rastro engine on Fly.io. Deploy from the repo root:  fly deploy --ha=false
# Keep exactly ONE machine: the demo data lives in that machine's SQLite file.
app = "rastro-engine"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  SERV_MODEL_BASE = "gpt-5.4-mini"
  USE_KRONOS = "true"
  SERV_BUDGET_USD = "5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
